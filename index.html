</style></head>
<body><div class="app">
<section id="home" class="screen active"><div class="top"><b class="brand">Louwe Fitness</b><button onclick="go('more')">+</button></div><div class="hero"><div class="heroText"><div class="ey">LOUWE FITNESS</div><h1>Vandaag.</h1><p>Kies wat vandaag past.</p></div></div><div class="content"><div class="head"><h2>Start</h2></div><div class="sports"><button class="sport" onclick="go('workouts')"><div class="sym">K</div><h3>Kracht</h3><p>Progressie & training</p></button><button class="sport" onclick="openLog('mtb')"><div class="sym">M</div><h3>Mountainbike</h3><p>Km · tijd · hoogte</p></button><button class="sport" onclick="openLog('run')"><div class="sym">R</div><h3>Hardlopen</h3><p>Km · tempo · tijd</p></button><button class="sport" onclick="openLog('squash')"><div class="sym">S</div><h3>Squash</h3><p>Sessie registreren</p></button></div><div class="head"><h2>Deze week</h2><button onclick="go('data')">Data</button></div><div class="stats" id="homeStats"></div><div class="insight" id="homeInsight"></div><div class="head"><h2>Recent</h2><button onclick="go('calendar')">Agenda</button></div><div id="recent"></div></div></section>
<section id="workouts" class="screen"><div class="title"><div class="ey">KRACHT</div><h1>Kies je training</h1></div><div class="filters"><button class="filter active" onclick="setWorkout('full',this)">Full body</button><button class="filter" onclick="setWorkout('upper',this)">Bovenlichaam</button><button class="filter" onclick="setWorkout('lower',this)">Onderlichaam</button><button class="filter" onclick="setWorkout('core',this)">Core</button></div><div id="workoutContent"></div></section>
<section id="strengthSession" class="screen"><div class="sessionHead"><button class="back" onclick="go('workouts')">‹ Kracht</button><div class="sessionTop"><div><div class="ey" id="sessionType"></div><div class="count" id="sessionCount"></div></div><div class="time" id="sessionTime"></div></div><div class="progress"><i id="sessionProgress"></i></div></div><div class="exHero"><div class="letter" id="exerciseLetter"></div><div class="muscle" id="exerciseMuscle"></div></div><div class="sessionBody"><h1 id="exerciseName"></h1><p id="exerciseDesc"></p><div class="sets"><div class="rowHead"><div>Set</div><div>KG</div><div>Reps</div></div><div id="setRows"></div></div><div class="timer"><div><small>Rust</small><strong id="timerText">01:30</strong></div><button onclick="toggleTimer()">Start timer</button></div><button class="start" id="nextBtn" onclick="nextExercise()">Volgende</button></div></section>
<section id="calendar" class="screen"><div class="title"><div class="ey">OVERZICHT</div><h1>Agenda</h1></div><div class="calendar"><div class="calHead"><button onclick="changeMonth(-1)">‹</button><h2 id="monthTitle"></h2><button onclick="changeMonth(1)">›</button></div><div class="week"><div>Ma</div><div>Di</div><div>Wo</div><div>Do</div><div>Vr</div><div>Za</div><div>Zo</div></div><div class="days" id="days"></div></div><div class="content"><div class="head"><h2>Activiteiten</h2><button onclick="calDate=new Date();renderCalendar()">Vandaag</button></div><div class="logs" id="calendarLogs"></div></div></section>
<section id="data" class="screen"><div class="title"><div class="ey">JOUW DATA</div><h1>Progressie</h1></div><div class="range"><button class="active" onclick="setRange('week',this)">Week</button><button onclick="setRange('month',this)">Maand</button><button onclick="setRange('all',this)">Alles</button></div><div class="content"><div class="metrics" id="metrics"></div><div class="head"><h2>Activiteit</h2></div><div class="chart" id="chart"></div><div class="dist" id="distribution"></div><div class="head"><h2>Kracht</h2></div><div class="dist" id="strengthData"></div></div></section>
<section id="more" class="screen"><div class="title"><div class="ey">LOUWE FITNESS</div><h1>Meer</h1></div><div class="more"><button class="moreItem" onclick="showSettings()"><div><h3>Instellingen</h3><p>Profiel en voorkeuren</p></div><span>›</span></button><button class="moreItem" onclick="exportData()"><div><h3>Data exporteren</h3><p>Bewaar een back-up</p></div><span>›</span></button></div><div id="settings" style="margin:12px 17px"></div></section></div>
<nav class="nav"><button class="active" data-s="home" onclick="go('home')"><div class="navIcon">⌂</div>Vandaag</button><button data-s="workouts" onclick="go('workouts')"><div class="navIcon">＋</div>Workouts</button><button data-s="calendar" onclick="go('calendar')"><div class="navIcon">□</div>Agenda</button><button data-s="data" onclick="go('data')"><div class="navIcon">▥</div>Data</button><button data-s="more" onclick="go('more')"><div class="navIcon">•••</div>Meer</button></nav><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='louweFitnessV6';const old=localStorage.getItem('louweFitnessV5')||localStorage.getItem('louweFitnessV3');let db=JSON.parse(localStorage.getItem(KEY)||old||'{"profile":{"name":"Louwe"},"activities":[],"strengthHistory":[]}');if(!db.profile)db.profile={name:'Louwe'};if(!db.activities)db.activities=[];if(!db.strengthHistory)db.strengthHistory=[];let range='week',calDate=new Date(),workoutKey='full',session=null,timer=null,timerLeft=90,sessionStart=0;const WEIGHTS=[10,16,21];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function dateKey(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}function fmt(n){return Number(n||0).toLocaleString('nl-NL',{maximumFractionDigits:1})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
const E={full:[['Goblet squat','Benen · core','GS','Squat met één dumbbell.','db',3,6,10],['Push-up','Borst · triceps','PU','Romp als één geheel; volledige controle.','body',3,6,15],['One-arm dumbbell row','Rug · biceps','ROW','Trek je elleboog richting heup.','db',3,6,10],['Dumbbell Romanian deadlift','Hamstrings · billen','RDL','Heupen naar achter, rug stabiel.','db',3,6,10],['Dumbbell overhead press','Schouders · triceps','OHP','Span romp en druk gecontroleerd.','db',3,6,10],['Bulgarian split squat','Benen · billen','BSS','Unilaterale beenkracht; bodyweight of dumbbell.','body/db',3,6,10],['Ab wheel rollout','Core','AW','Rol alleen zover uit als je romp stabiel blijft.','equipment',3,6,12]],upper:[['Push-up','Borst · triceps','PU','Sterke bodyweight duwbeweging.','body',3,6,15],['One-arm dumbbell row','Rug · biceps','ROW','Eenzijdig trekken met stabiele romp.','db',3,6,10],['Dumbbell floor press','Borst · triceps','FP','Gecontroleerd drukken vanuit de vloer.','db',3,6,10],['Pike push-up','Schouders · triceps','PP','Bodyweight verticale duwvariant.','body',3,6,12],['Dumbbell overhead press','Schouders · triceps','OHP','Eén dumbbell; wissel arm per set.','db',3,6,10],['Dead bug','Core','DB','Langzaam en stabiel.','body',3,8,12]],lower:[['Bulgarian split squat','Benen · billen','BSS','Begin zonder gewicht; voeg dumbbell toe als nodig.','body/db',3,6,10],['Dumbbell Romanian deadlift','Hamstrings · billen','RDL','Heupdominante beweging.','db',3,6,10],['Reverse lunge','Benen · billen','RL','Stap achteruit en controleer de afdaling.','body/db',3,8,12],['Single-leg glute bridge','Billen · hamstrings','GB','Pauzeer bovenin.','body',3,8,15],['Single-leg calf raise','Kuiten','CALF','Volledige range; dumbbell optioneel.','body/db',3,8,15],['Wall sit','Benen','WS','Bouw de houdtijd geleidelijk op.','body',3,30,60]],core:[['Ab wheel rollout','Core','AW','Anti-extensie; korte range is prima.','equipment',3,6,12],['Dead bug','Core','DB','Gecontroleerde rompstabiliteit.','body',3,8,12],['Side plank','Core · heup','SP','Houd lichaam in één lijn.','body',3,20,45],['Suitcase march','Core · grip','SM','Draag één dumbbell zonder te kantelen.','db',3,30,60],['Bird dog','Core · rug','BD','Langzame contralaterale beweging.','body',3,8,12],['Glute bridge','Core · billen','GB','Rustige heupextensie.','body',3,10,15]]};const L={full:'Full body',upper:'Bovenlichaam',lower:'Onderlichaam',core:'Core'};
function go(s){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===s));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===s));document.querySelector('.nav').style.display=s==='strengthSession'?'none':'grid';scrollTo(0,0);if(s==='home')home();if(s==='workouts')workouts();if(s==='calendar')renderCalendar();if(s==='data')data()}function setWorkout(k,b){workoutKey=k;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');workouts()}
function workouts(){let e=E[workoutKey];document.getElementById('workoutContent').innerHTML=`<div class="feature"><div class="cover"><h2>${L[workoutKey]}</h2></div><div class="body"><div class="tags"><span class="tag">${e.length} oefeningen</span><span class="tag">35–55 min</span><span class="tag">Bodyweight + dumbbell</span></div><p>${workoutKey==='full'?'Sterke basis voor het hele lichaam.':workoutKey==='upper'?'Duwen, trekken en schouderwerk.':workoutKey==='lower'?'Unilaterale beenkracht en heupdominante bewegingen.':'Rompstabiliteit en core-kracht.'}</p><button class="start" onclick="startWorkout()">Start ${L[workoutKey].toLowerCase()}</button></div></div><div class="head" style="padding:0 17px"><h2>Oefeningen</h2></div><div class="list">${e.map((x,i)=>`<button class="ex" onclick="info(${i})"><div class="thumb">${x[2]}</div><div><h4>${x[0]}</h4><p>${x[5]} sets · ${x[6]}–${x[7]} reps · ${x[1]}</p></div><span class="chev">›</span></button>`).join('')}</div>`}
function best(n){return db.strengthHistory.filter(x=>x.exercise===n).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null}function suggestedWeight(name){let b=best(name);if(!b)return '';let last=Math.max(...b.sets.map(s=>Number(s.kg)||0));let avg=b.sets.reduce((s,x)=>s+(Number(x.reps)||0),0)/Math.max(1,b.sets.length);if(!last)return '';if(avg>=10){let next=WEIGHTS.find(w=>w>last);return next?String(next):String(last)}return String(last)}
function startWorkout(){session={index:0,sets:E[workoutKey].map(x=>Array.from({length:x[5]},()=>({kg:'',reps:''}))),key:workoutKey};sessionStart=Date.now();go('strengthSession');sessionRender()}
function sessionRender(){let e=E[session.key][session.index],b=best(e[0]),suggest=suggestedWeight(e[0]);document.getElementById('sessionType').textContent=L[session.key].toUpperCase();document.getElementById('sessionCount').textContent=`${session.index+1} / ${E[session.key].length}`;document.getElementById('sessionTime').textContent=Math.max(1,Math.round((Date.now()-sessionStart)/60000))+' min';document.getElementById('sessionProgress').style.width=((session.index+1)/E[session.key].length*100)+'%';document.getElementById('exerciseLetter').textContent=e[2];document.getElementById('exerciseMuscle').textContent=e[1];document.getElementById('exerciseName').textContent=e[0];document.getElementById('exerciseDesc').textContent=e[3];document.getElementById('setRows').innerHTML=Array.from({length:e[5]},(_,i)=>{let ph=b?.sets?.[i]?.kg||suggest||'kg';return `<div class="row"><div>${i+1}</div><input class="input" inputmode="decimal" placeholder="${ph}" value="${session.sets[session.index][i].kg}" oninput="session.sets[${session.index}][${i}].kg=this.value"><input class="input" inputmode="numeric" placeholder="${e[6]}–${e[7]}" value="${session.sets[session.index][i].reps}" oninput="session.sets[${session.index}][${i}].reps=this.value"></div>`}).join('');document.getElementById('nextBtn').textContent=session.index===E[session.key].length-1?'Workout afronden':'Volgende';resetTimer()}
function nextExercise(){if(!session.sets[session.index].every(x=>Number(x.reps)>0)){toast('Vul je reps in');return}if(session.index<E[session.key].length-1){session.index++;sessionRender()}else finish()}function finish(){let volume=0;session.sets.forEach((sets,i)=>{let e=E[session.key][i],clean=sets.map(x=>({kg:Number(x.kg)||0,reps:Number(x.reps)||0}));volume+=clean.reduce((s,x)=>s+x.kg*x.reps,0);if(clean.some(x=>x.reps))db.strengthHistory.push({id:uid(),date:dateKey(),exercise:e[0],sets:clean,volume:clean.reduce((s,x)=>s+x.kg*x.reps,0)})});db.activities.push({id:uid(),type:'strength',date:dateKey(),duration:Math.max(1,Math.round((Date.now()-sessionStart)/60000)),sets:session.sets.reduce((s,x)=>s+x.length,0),volume:Math.round(volume),workout:L[session.key]});save();clearInterval(timer);go('home');toast('Workout opgeslagen')}
function resetTimer(){clearInterval(timer);timer=null;timerLeft=90;document.getElementById('timerText').textContent='01:30'}function toggleTimer(){let b=document.querySelector('.timer button');if(timer){clearInterval(timer);timer=null;b.textContent='Start timer';return}b.textContent='Pauze';timer=setInterval(()=>{timerLeft--;document.getElementById('timerText').textContent=`${String(Math.floor(timerLeft/60)).padStart(2,'0')}:${String(timerLeft%60).padStart(2,'0')}`;if(timerLeft<=0){clearInterval(timer);timer=null;b.textContent='Start timer';toast('Rust voorbij')}},1000)}
function info(i){let e=E[workoutKey][i],w=e[4]==='db'?'10 / 16 / 21 kg':e[4];openModal(`<div class="sheetHead"><h2>${e[0]}</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:11px;color:#6e7d82;line-height:1.5">${e[3]}</p><div class="metrics"><div class="metric"><small>Sets</small><strong>${e[5]}</strong></div><div class="metric"><small>Reps</small><strong>${e[6]}–${e[7]}</strong></div><div class="metric"><small>Materiaal</small><strong>${w}</strong></div></div>`) }
function openLog(t){let f=t==='mtb'?`<div class="field"><label>Km</label><input id="a1" inputmode="decimal"></div><div class="field"><label>Tijd (min)</label><input id="a2" inputmode="numeric"></div><div class="field"><label>Hoogtemeters</label><input id="a3" inputmode="numeric"></div>`:t==='run'?`<div class="field"><label>Km</label><input id="a1" inputmode="decimal"></div><div class="field"><label>Tijd (min)</label><input id="a2" inputmode="numeric"></div><div class="field"><label>Notitie</label><textarea id="a3"></textarea></div>`:`<div class="field"><label>Duur (min)</label><input id="a1" inputmode="numeric"></div><div class="field"><label>Notitie</label><textarea id="a2"></textarea></div>`;openModal(`<div class="sheetHead"><h2>${t==='mtb'?'Mountainbike':t==='run'?'Hardlopen':'Squash'}</h2><button class="close" onclick="closeModal()">×</button></div>${f}<div class="field"><label>Datum</label><input id="ad" type="date" value="${dateKey()}"></div><button class="start" onclick="saveActivity('${t}')">Opslaan</button>`)}
function saveActivity(t){let a={id:uid(),type:t,date:document.getElementById('ad').value||dateKey(),createdAt:Date.now()};if(t==='mtb'){a.km=+a1.value||0;a.duration=+a2.value||0;a.elevation=+a3.value||0}else if(t==='run'){a.km=+a1.value||0;a.duration=+a2.value||0;a.note=a3.value}else{a.duration=+a1.value||0;a.note=a2.value}db.activities.push(a);save();closeModal();go('home');toast('Activiteit opgeslagen')}
function startWeek(d=new Date()){let x=new Date(d),n=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-n);return x}function inRange(s,r){let d=new Date(s+'T12:00:00'),n=new Date();return r==='week'?d>=startWeek(n):r==='month'?d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear():true}function mins(a){return a.type==='strength'?a.duration||45:a.duration||0}function typeName(t){return t==='strength'?'Kracht':t==='mtb'?'Mountainbike':t==='run'?'Hardlopen':'Squash'}function logHTML(a){let d=a.type==='strength'?`${a.duration||0} min · ${a.sets||0} sets`:a.type==='mtb'?`${fmt(a.km)} km · ${a.duration||0} min · ${a.elevation||0} hm`:a.type==='run'?`${fmt(a.km)} km · ${a.duration||0} min`:`${a.duration||0} min`;return `<div class="log"><div><h4>${typeName(a.type)}</h4><p>${fmtDate(a.date)} · ${d}</p></div><b>${a.type[0].toUpperCase()}</b></div>`}
function home(){let a=db.activities.filter(x=>inRange(x.date,'week')),km=a.reduce((s,x)=>s+(x.km||0),0),mi=a.reduce((s,x)=>s+mins(x),0),st=a.filter(x=>x.type==='strength').length;document.getElementById('homeStats').innerHTML=`<div class="stat"><small>Sessies</small><strong>${a.length}</strong></div><div class="stat"><small>Km</small><strong>${fmt(km)}</strong></div><div class="stat"><small>Minuten</small><strong>${mi}</strong></div>`;document.getElementById('homeInsight').innerHTML=`<b>INZICHT</b><h3>${st?'Kracht blijft de basis.':'Bouw je basis op.'}</h3><p>${st?`${st} krachtmoment${st===1?'':'en'} deze week.`:'Start met een krachttraining en leg je eerste gewichten vast.'}</p>`;let r=[...db.activities].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)).slice(0,3);document.getElementById('recent').innerHTML=r.length?`<div class="logs">${r.map(logHTML).join('')}</div>`:`<div class="empty"><strong>Nog geen activiteiten</strong>Je eerste sessie verschijnt hier.</div>`}
function changeMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();document.getElementById('monthTitle').textContent=new Date(y,m,1).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});let h='';for(let i=0;i<42;i++){let n=i-start+1,d=n,mm=m,yy=y,muted=false;if(n<1){d=new Date(y,m,0).getDate()+n;mm--;muted=true;if(mm<0){mm=11;yy--}}if(n>last){d=n-last;mm++;muted=true;if(mm>11){mm=0;yy++}}let k=`${yy}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,aa=db.activities.filter(a=>a.date===k);h+=`<button class="day ${muted?'muted':''} ${k===dateKey()?'today':''}" onclick="showDay('${k}')"><span class="n">${d}</span><span class="dots">${aa.map(a=>`<i class="dot ${a.type}"></i>`).join('')}</span></button>`}document.getElementById('days').innerHTML=h;let list=db.activities.filter(a=>{let d=new Date(a.date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('calendarLogs').innerHTML=list.length?list.map(logHTML).join(''):`<div class="empty"><strong>Geen activiteiten</strong>Deze maand staat nog leeg.</div>`}function showDay(k){let a=db.activities.filter(x=>x.date===k);openModal(`<div class="sheetHead"><h2>${fmtDate(k)}</h2><button class="close" onclick="closeModal()">×</button></div>${a.length?`<div class="logs" style="margin-top:12px">${a.map(logHTML).join('')}</div>`:`<div class="empty" style="margin-top:12px"><strong>Geen activiteit</strong>Geen sessie geregistreerd.</div>`}`)}
function setRange(r,b){range=r;document.querySelectorAll('.range button').forEach(x=>x.classList.remove('active'));b.classList.add('active');data()}function data(){let a=db.activities.filter(x=>inRange(x.date,range)),st=a.filter(x=>x.type==='strength'),km=a.reduce((s,x)=>s+(x.km||0),0),mi=a.reduce((s,x)=>s+mins(x),0);document.getElementById('metrics').innerHTML=`<div class="metric"><small>Sessies</small><strong>${a.length}</strong></div><div class="metric"><small>Kracht</small><strong>${st.length}</strong></div><div class="metric"><small>Afstand</small><strong>${fmt(km)} km</strong></div><div class="metric"><small>Tijd</small><strong>${mi} min</strong></div>`;let bars=[],n=new Date();if(range==='week'){let s=startWeek(n);for(let i=0;i<7;i++){let d=new Date(s);d.setDate(d.getDate()+i);bars.push({l:['M','D','W','D','V','Z','Z'][i],v:a.filter(x=>x.date===dateKey(d)).length})}}else if(range==='month'){let days=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();let chunks=Math.ceil(days/7);for(let i=0;i<chunks;i++){let from=i*7+1,to=Math.min(days,(i+1)*7);bars.push({l:`${from}`,v:a.filter(x=>{let d=new Date(x.date+'T12:00:00');return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()>=from&&d.getDate()<=to}).length})}}else{for(let i=11;i>=0;i--){let d=new Date(n.getFullYear(),n.getMonth()-i,1);bars.push({l:d.toLocaleDateString('nl-NL',{month:'short'}).replace('.',''),v:a.filter(x=>{let z=new Date(x.date+'T12:00:00');return z.getFullYear()===d.getFullYear()&&z.getMonth()===d.getMonth()}).length})}}let max=Math.max(1,...bars.map(x=>x.v));document.getElementById('chart').innerHTML=bars.map(x=>`<div class="barWrap"><div class="bar" style="height:${Math.max(4,x.v/max*100)}%"></div><span class="barLabel">${x.l}</span></div>`).join('');let total=a.length||1;document.getElementById('distribution').innerHTML=`<div style="font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#718187;font-weight:850">Sportverdeling</div>`+[['Kracht','strength'],['Mountainbike','mtb'],['Hardlopen','run'],['Squash','squash']].map(x=>{let v=a.filter(y=>y.type===x[1]).length;return `<div class="distRow"><div class="distTop"><span>${x[0]}</span><span>${Math.round(v/total*100)}%</span></div><div class="track"><i style="width:${v/total*100}%"></i></div></div>`}).join('');let hist=[...db.strengthHistory].reverse().slice(0,8);document.getElementById('strengthData').innerHTML=hist.length?hist.map(x=>`<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:9px"><span>${x.exercise}</span><b>${Math.max(...x.sets.map(s=>s.kg||0))} kg · ${x.volume||0} kg</b></div>`).join(''):`<div class="empty" style="border:0;background:none;padding:8px">Je krachtdata verschijnt hier na je eerste workout.</div>`}
function showSettings(){document.getElementById('settings').innerHTML=`<div class="sheet" style="border-radius:18px"><div class="field"><label>Naam</label><input id="pname" value="${esc(db.profile?.name||'Louwe')}"></div><button class="start" onclick="db.profile.name=document.getElementById('pname').value||'Louwe';save();toast('Opgeslagen')">Opslaan</button></div>`}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='louwe-fitness-backup.json';a.click();toast('Back-up gemaakt')}function openModal(x){document.getElementById('sheet').innerHTML=x;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
home();workouts();renderCalendar();data();
</script></body></html>
