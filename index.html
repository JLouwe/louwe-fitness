function setRange(r,b){range=r;document.querySelectorAll('.range button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderData()}function inRange(s,r){let d=new Date(s+'T12:00:00'),n=new Date();if(r==='week'){let st=startWeek(n),e=new Date(st);e.setDate(e.getDate()+7);return d>=st&&d<e}if(r==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();return true}function renderData(){let a=db.activities.filter(x=>inRange(x.date,range)),strength=a.filter(x=>x.type==='strength'),km=a.reduce((s,x)=>s+(Number(x.km)||0),0),min=a.reduce((s,x)=>s+(Number(x.duration)||0),0);document.getElementById('metrics').innerHTML=`<div class="metric"><small>Sessies</small><strong>${a.length}</strong></div><div class="metric"><small>Kracht</small><strong>${strength.length}</strong></div><div class="metric"><small>Afstand</small><strong>${fmt(km)} km</strong></div><div class="metric"><small>Tijd</small><strong>${min} min</strong></div>`;let bars=[],n=new Date();if(range==='week'){let s=startWeek(n);for(let i=0;i<7;i++){let d=new Date(s);d.setDate(d.getDate()+i);bars.push({l:['M','D','W','D','V','Z','Z'][i],v:a.filter(x=>x.date===dateKey(d)).length})}}else if(range==='month'){let days=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();for(let i=0;i<Math.ceil(days/7);i++){let f=i*7+1,t=Math.min(days,(i+1)*7);bars.push({l:f,v:a.filter(x=>{let d=new Date(x.date+'T12:00:00');return d.getMonth()===n.getMonth()&&d.getDate()>=f&&d.getDate()<=t}).length})}}else{for(let i=11;i>=0;i--){let d=new Date(n.getFullYear(),n.getMonth()-i,1);bars.push({l:d.toLocaleDateString('nl-NL',{month:'short'}).replace('.',''),v:a.filter(x=>{let z=new Date(x.date+'T12:00:00');return z.getFullYear()===d.getFullYear()&&z.getMonth()===d.getMonth()}).length})}}let max=Math.max(1,...bars.map(x=>x.v));document.getElementById('chart').innerHTML=bars.map(x=>`<div class="barWrap"><div class="bar" style="height:${Math.max(4,x.v/max*100)}%"></div><span class="barLabel">${x.l}</span></div>`).join('');let total=a.length||1;document.getElementById('distribution').innerHTML=`<div style="font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#718187;font-weight:850">Sportverdeling</div>`+['strength','mtb','run','squash'].map(t=>{let v=a.filter(x=>x.type===t).length;return `<div class="distRow"><div class="distTop"><span>${typeName(t)}</span><span>${Math.round(v/total*100)}%</span></div><div class="track"><i style="width:${v/total*100}%"></i></div></div>`}).join('');let h=db.workoutHistory.slice().reverse().slice(0,8);document.getElementById('strengthData').innerHTML=h.length?h.map(x=>`<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:9px"><span>${x.workout}</span><b>${fmtDate(x.date)}</b></div>`).join(''):`<div class="empty" style="border:0;background:none;padding:8px">Je krachttrainingen verschijnen hier.</div>`}
