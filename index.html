const LABEL={full:'Full body',upper:'Bovenlichaam',lower:'Onderlichaam',core:'Core'};const META={strength:{label:'Kracht',target:2},mtb:{label:'MTB',target:1},run:{label:'Run',target:1},squash:{label:'Squash',target:1}};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function startWeek(d){let x=new Date(d),n=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-n);return x}function daysBetween(a,b=new Date()){return Math.max(0,Math.floor((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000))}function fmt(n){return Number(n||0).toLocaleString('nl-NL',{maximumFractionDigits:1})}function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.opacity=1;t.style.transform='translate(-50%,0)';clearTimeout(toast.t);toast.t=setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,15px)'},1600)}
function go(s){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===s));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===s));document.querySelector('.nav').style.display=s==='session'?'none':'grid';scrollTo(0,0);if(s==='home')home();if(s==='workouts')renderWorkouts();if(s==='calendar')renderCalendar();if(s==='data')renderData()}
function totalSets(w){return w[3].reduce((s,e)=>s+Number(e[1].split('×')[0].trim()),0)}function setCat(k,b){cat=k;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderWorkouts()}
function renderWorkouts(){document.getElementById('workoutContent').innerHTML=W[cat].map((w,i)=>`<div class="workoutCard"><div class="workoutHero"><div><div class="ey">${LABEL[cat]}</div><h2>${w[0]}</h2></div></div><div class="workoutBody"><div class="tags"><span class="tag">${w[3].length} oefeningen</span><span class="tag">± ${w[2]} min</span><span class="tag">${totalSets(w)} werksets</span></div><p>${w[1]}</p><button class="start" onclick="startWorkout(${i})">Start training</button></div></div><div class="list">${w[3].map((e,j)=>`<button class="exerciseCard" onclick="showExercise(${i},${j})"><div class="thumb">${j+1}</div><div><h4>${e[0]}</h4><p>${e[2]} · ${e[3]}</p></div><b>${e[1]}</b></button>`).join('')}</div>`).join('')}
function showExercise(i,j){let e=W[cat][i][3][j];openModal(`<div class="sheetHead"><h2>${e[0]}</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:11px;color:#6e6c65;line-height:1.5">${e[2]} · ${e[3]}</p><div style="margin-top:12px;font-size:10px"><b>${e[1]}</b></div><p style="font-size:10px;color:#77746c;line-height:1.5">Werk gecontroleerd door de volledige beschikbare bewegingsbaan. Stop een set wanneer de techniek duidelijk begint te verslechteren.</p>`)}
function startWorkout(i){selected=W[cat][i];sessionIndex=0;doneSets=selected[3].map(e=>Array(Number(e[1].split('×')[0].trim())).fill(false));go('session');renderSession()}function renderSession(){let e=selected[3][sessionIndex],sets=Number(e[1].split('×')[0].trim()),rep=e[1].split('×')[1].trim();document.getElementById('sessionType').textContent=selected[0].toUpperCase();document.getElementById('sessionCount').textContent=`${sessionIndex+1} / ${selected[3].length}`;document.getElementById('sessionTime').textContent=`± ${selected[2]} min`;document.getElementById('sessionProgress').style.width=((sessionIndex+1)/selected[3].length*100)+'%';document.getElementById('exerciseName').textContent=e[0];document.getElementById('exerciseDesc').textContent='Uitdagend, maar technisch goed. Jij bepaalt zelf de weerstand.';document.getElementById('sessionMeta').innerHTML=`<span class="meta">${e[2]}</span><span class="meta">${rep} reps</span>`;document.getElementById('setBox').innerHTML=Array.from({length:sets},(_,i)=>`<div class="setLine"><span>Set ${i+1}</span><b>${rep}</b><button class="done ${doneSets[sessionIndex][i]?'on':''}" onclick="toggleSet(${i})">${doneSets[sessionIndex][i]?'✓':'○'}</button></div>`).join('');document.getElementById('nextBtn').textContent=sessionIndex===selected[3].length-1?'Training afronden':'Volgende';resetRest()}function toggleSet(i){doneSets[sessionIndex][i]=!doneSets[sessionIndex][i];renderSession()}function nextExercise(){if(!doneSets[sessionIndex].every(Boolean)){toast('Voltooi eerst alle sets');return}if(sessionIndex<selected[3].length-1){sessionIndex++;renderSession()}else finishWorkout()}function finishWorkout(){db.activities.push({id:uid(),type:'strength',date:dateKey(),createdAt:Date.now(),duration:selected[2],workout:selected[0],category:cat,exercises:selected[3].length,sets:totalSets(selected)});db.workoutHistory.push({date:dateKey(),workout:selected[0],category:cat});save();go('home');toast('Training opgeslagen')}function resetRest(){clearInterval(restTimer);restTimer=null;restLeft=90;document.getElementById('restText').textContent='01:30';document.getElementById('restBtn').textContent='Start timer'}function toggleRest(){let b=document.getElementById('restBtn');if(restTimer){clearInterval(restTimer);restTimer=null;b.textContent='Start timer';return}b.textContent='Pauze';restTimer=setInterval(()=>{restLeft--;document.getElementById('restText').textContent=`${String(Math.floor(restLeft/60)).padStart(2,'0')}:${String(restLeft%60).padStart(2,'0')}`;if(restLeft<=0){clearInterval(restTimer);restTimer=null;b.textContent='Start timer';toast('Rust voorbij')}},1000)}
function recentSport(t){return db.activities.filter(x=>x.type===t).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0))[0]||null}function weekCount(t){let s=startWeek(new Date()),e=new Date(s);e.setDate(e.getDate()+7);return db.activities.filter(a=>a.type===t&&new Date(a.date+'T12:00:00')>=s&&new Date(a.date+'T12:00:00')<e).length}function score(t){let last=recentSport(t),days=last?daysBetween(new Date(last.date+'T12:00:00')):30,target=META[t].target;return .55*Math.max(0,(target-weekCount(t))/target)+.45*Math.min(1.5,days/7)}function recommendation(){let types=['strength','mtb','run','squash'],p=types.map(t=>({t,s:score(t)})).sort((a,b)=>b.s-a.s)[0];if(!db.activities.length)return {title:'Full body A',desc:'Een sterke start: 7 oefeningen, grote bewegingen en duidelijke rust.',meta:'45 min · 7 oefeningen',action:"cat='full';go('workouts')",label:'Start'};if(p.t==='strength'){let last=recentSport('strength'),key=last?.category==='full'?'upper':last?.category==='upper'?'lower':'full',w=W[key][0];return {title:w[0],desc:'Kracht heeft op basis van je recente trainingsritme nu de hoogste prioriteit.',meta:`±${w[2]} min · ${w[3].length} oefeningen`,action:`cat='${key}';go('workouts')`,label:'Bekijk'}}return {title:META[p.t].label,desc:'Deze sport staat op basis van je gelogde weekritme het meest vooraan.',meta:'Log activiteit',action:`openLog('${p.t}')`,label:'Log'} }
function home(){let r=recommendation();let d=new Date();document.querySelector('.heroText .ey').textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();document.getElementById('recommend').innerHTML=`<div class="recommend"><div class="recommendInner"><div><div class="recommendKicker">VOOR JOU</div><h2>${r.title}</h2><p>${r.desc}</p></div><div class="recBottom"><span class="meta">${r.meta}</span><button class="primary" onclick="${r.action}">${r.label}</button></div></div></div>`;weekHTML();sportHTML();recentHTML()}
function weekHTML(){let s=startWeek(new Date()),names=['M','D','W','D','V','Z','Z'],a=db.activities.filter(x=>{let d=new Date(x.date+'T12:00:00'),e=new Date(s);e.setDate(e.getDate()+7);return d>=s&&d<e}),min=a.reduce((q,x)=>q+(Number(x.duration)||0),0),km=a.reduce((q,x)=>q+(Number(x.km)||0),0),days=[...new Set(a.map(x=>x.date))].length;document.getElementById('weekLabel').textContent=`${days} actieve dagen`;document.getElementById('weekCard').innerHTML=`<div class="weekTop"><strong>${a.length}</strong><span>sessies deze week</span></div><div class="weekGrid">${names.map((n,i)=>{let d=new Date(s);d.setDate(d.getDate()+i),k=dateKey(d),aa=a.filter(x=>x.date===k);return `<div class="wd"><b>${n}</b><i class="${aa.length?'active':''} ${k===dateKey()?'today':''}">${d.getDate()}</i></div>`}).join('')}</div><div class="weekStats"><div class="ws"><strong>${min}</strong><span>minuten</span></div><div class="ws"><strong>${fmt(km)}</strong><span>km</span></div><div class="ws"><strong>${weekCount('strength')}</strong><span>kracht</span></div><div class="ws"><strong>${weekCount('mtb')+weekCount('run')+weekCount('squash')}</strong><span>buiten</span></div></div>`}
function sportHTML(){let s=startWeek(new Date()),e=new Date(s);e.setDate(e.getDate()+7);let types=['strength','mtb','run','squash'];document.getElementById('sportTable').innerHTML=types.map(t=>{let a=db.activities.filter(x=>x.type===t&&new Date(x.date+'T12:00:00')>=s&&new Date(x.date+'T12:00:00')<e),last=recentSport(t);let val=t==='mtb'||t==='run'?fmt(a.reduce((q,x)=>q+(Number(x.km)||0),0))+' km':t==='strength'?a.length+' sessies':a.reduce((q,x)=>q+(Number(x.duration)||0),0)+' min';return `<div class="sportRow"><div class="label sportName"><i class="dot ${t}"></i>${META[t].label}</div><div class="num">${val}</div><div class="last">${last?'laatst '+fmtDate(last.date):'nog niet'}</div></div>`}).join('')}
function icon(t){return t==='strength'?'<svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>':t==='mtb'?'<svg viewBox="0 0 24 24"><circle cx="7" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M7 17l4-8 3 8m-5-5h5l4 5"/></svg>':t==='run'?'<svg viewBox="0 0 24 24"><circle cx="14" cy="5" r="2"/><path d="M10 10l4-2 2 3-3 2 2 5M11 12l-4 3M13 18l-3 3"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 15l6-6"/></svg>'}function recentHTML(){let a=[...db.activities].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)).slice(0,4);document.getElementById('recent').innerHTML=a.length?`<div class="recent">${a.map(x=>`<div class="recentItem"><div class="recentIcon">${icon(x.type)}</div><div><h4>${META[x.type]?.label||x.type}</h4><p>${fmtDate(x.date)} · ${x.duration||0} min${x.km?' · '+fmt(x.km)+' km':''}</p></div><span class="recentValue">${x.type==='strength'?x.workout:(x.km?fmt(x.km)+' km':(x.duration||0)+' min')}</span></div>`).join('')}</div>`:`<div class="empty"><strong>Nog geen activiteiten</strong>Je eerste training of sportmoment verschijnt hier.</div>`}
function openLog(t){let f=t==='mtb'?`<div class="field"><label>Km</label><input id="a1" inputmode="decimal"></div><div class="field"><label>Tijd (min)</label><input id="a2" inputmode="numeric"></div>`:t==='run'?`<div class="field"><label>Km</label><input id="a1" inputmode="decimal"></div><div class="field"><label>Tijd (min)</label><input id="a2" inputmode="numeric"></div>`:`<div class="field"><label>Duur (min)</label><input id="a1" inputmode="numeric"></div>`;openModal(`<div class="sheetHead"><h2>${META[t].label}</h2><button class="close" onclick="closeModal()">×</button></div>${f}<div class="field"><label>Datum</label><input id="ad" type="date" value="${dateKey()}"></div><button class="start" style="margin-top:14px" onclick="saveActivity('${t}')">Opslaan</button>`)}function saveActivity(t){let date=document.getElementById('ad').value||dateKey(),a={id:uid(),type:t,date,createdAt:Date.now()};let du=Number(document.getElementById('a2')?.value||document.getElementById('a1')?.value||0);if(t==='mtb'||t==='run'){let km=Number(document.getElementById('a1').value);du=Number(document.getElementById('a2').value);if(!(km>0)||!(du>0)){toast('Vul km en tijd in');return}a.km=km}else if(!(du>0)){toast('Vul duur in');return}a.duration=du;db.activities.push(a);save();closeModal();go('home');toast('Activiteit opgeslagen')}
function changeMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),h='';document.getElementById('monthTitle').textContent=new Date(y,m,1).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});for(let i=0;i<42;i++){let n=i-start+1,d=n,mm=m,yy=y,muted=false;if(n<1){d=new Date(y,m,0).getDate()+n;mm--;muted=true;if(mm<0){mm=11;yy--}}if(n>last){d=n-last;mm++;muted=true;if(mm>11){mm=0;yy++}}let k=`${yy}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,aa=db.activities.filter(a=>a.date===k);h+=`<button class="day ${muted?'muted':''} ${k===dateKey()?'today':''}" onclick="showDay('${k}')"><span class="n">${d}</span><span class="dots">${aa.map(a=>`<i class="${a.type}"></i>`).join('')}</span></button>`}document.getElementById('days').innerHTML=h;let list=db.activities.filter(a=>{let d=new Date(a.date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('calendarLogs').innerHTML=list.length?list.map(a=>`<div class="recentItem"><div class="recentIcon">${icon(a.type)}</div><div><h4>${META[a.type]?.label||a.type}</h4><p>${fmtDate(a.date)} · ${a.duration||0} min${a.km?' · '+fmt(a.km)+' km':''}</p></div></div>`).join(''):`<div class="empty"><strong>Geen activiteiten</strong>Deze maand staat nog leeg.</div>`}function showDay(k){let a=db.activities.filter(x=>x.date===k);openModal(`<div class="sheetHead"><h2>${fmtDate(k)}</h2><button class="close" onclick="closeModal()">×</button></div>${a.length?a.map(x=>`<div class="recentItem"><div class="recentIcon">${icon(x.type)}</div><div><h4>${META[x.type]?.label||x.type}</h4><p>${x.duration||0} min${x.km?' · '+fmt(x.km)+' km':''}</p></div></div>`).join(''):`<div class="empty" style="margin-top:12px"><strong>Geen activiteit</strong>Geen sessie geregistreerd.</div>`}`)}
function setRange(r,b){range=r;document.querySelectorAll('.range button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderData()}function inRange(s,r){let d=new Date(s+'T12:00:00'),n=new Date();if(r==='week'){let st=startWeek(n),e=new Date(st);e.setDate(e.getDate()+7);return d>=st&&d<e}if(r==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();return true}function renderData(){let a=db.activities.filter(x=>inRange(x.date,range)),strength=a.filter(x=>x.type==='strength'),km=a.reduce((s,x)=>s+(Number(x.km)||0),0),min=a.reduce((s,x)=>s+(Number(x.duration)||0),0);document.getElementById('metrics').innerHTML=`<div class="metric"><small>Sessies</small><strong>${a.length}</strong></div><div class="metric"><small>Kracht</small><strong>${strength.length}</strong></div><div class="metric"><small>Afstand</small><strong>${fmt(km)} km</strong></div><div class="metric"><small>Tijd</small><strong>${min} min</strong></div>`;let bars=[],n=new Date();if(range==='week'){let s=startWeek(n);for(let i=0;i<7;i++){let d=new Date(s);d.setDate(d.getDate()+i);bars.push({l:['M','D','W','D','V','Z','Z'][i],v:a.filter(x=>x.date===dateKey(d)).length})}}else if(range==='month'){let days=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();for(let i=0;i<Math.ceil(days/7);i++){let f=i*7+1,t=Math.min(days,(i+1)*7);bars.push({l:f,v:a.filter(x=>{let d=new Date(x.date+'T12:00:00');return d.getDate()>=f&&d.getDate()<=t}).length})}}else{for(let i=11;i>=0;i--){let d=new Date(n.getFullYear(),n.getMonth()-i,1);bars.push({l:d.toLocaleDateString('nl-NL',{month:'short'}).replace('.',''),v:a.filter(x=>{let z=new Date(x.date+'T12:00:00');return z.getFullYear()===d.getFullYear()&&z.getMonth()===d.getMonth()}).length})}}let max=Math.max(1,...bars.map(x=>x.v));document.getElementById('chart').innerHTML=bars.map(x=>`<div class="barWrap"><div class="bar" style="height:${Math.max(4,x.v/max*100)}%"></div><span class="barLabel">${x.l}</span></div>`).join('');let total=a.length||1;document.getElementById('distribution').innerHTML=`<div style="font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:850">Sportverdeling</div>`+['strength','mtb','run','squash'].map(t=>{let v=a.filter(x=>x.type===t).length;return `<div class="distRow"><div class="distTop"><span>${META[t].label}</span><span>${Math.round(v/total*100)}%</span></div><div class="track"><i style="width:${v/total*100}%"></i></div></div>`}).join('');let h=db.workoutHistory.slice().reverse().slice(0,8);document.getElementById('strengthData').innerHTML=h.length?h.map(x=>`<div class="recentItem"><div><h4>${x.workout}</h4><p>${fmtDate(x.date)}</p></div></div>`).join(''):`<div class="empty"><strong>Nog geen krachttrainingen</strong>Je sessies verschijnen hier.</div>`}
function showMethod(){openModal(`<div class="sheetHead"><h2>Voor jou</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:11px;line-height:1.55;color:#6e6c65">De aanbeveling gebruikt je gelogde activiteiten: weekfrequentie en tijd sinds je laatste sessie. Het is bewust geen medische of vermoeidheidsanalyse.</p><p style="font-size:11px;line-height:1.55;color:#6e6c65">De krachtbibliotheek gebruikt meerdere sets, praktische rep-ranges en systematische variatie. Je hoeft geen gewicht, 1RM of progressie in de app bij te houden.</p>`)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='louwe-fitness-backup.json';a.click();toast('Back-up gemaakt')}function openModal(x){document.getElementById('sheet').innerHTML=x;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
home();renderWorkouts();renderCalendar();renderData();
</script></body></html>
